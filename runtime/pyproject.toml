[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sessiongraph-local"
version = "0.1.0"
description = "Project-scoped Codex session evidence search; zero-model retrieval"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
jev = ["certifi"]
mcp = ["mcp>=1.28,<2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mcp>=1.28,<2", "certifi"]

[project.scripts]
sessiongraph = "sessiongraph.cli:main"

[tool.setuptools.package-data]
sessiongraph = ["policy.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
