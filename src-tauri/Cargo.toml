[package]
name = "sessiongraph-app"
version = "0.1.0"
description = "Local source-backed project memory"
authors = ["shengzhoukong"]
edition = "2021"
[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
[dependencies]
tauri = { version = "=2.11.3", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
libc = "0.2"
